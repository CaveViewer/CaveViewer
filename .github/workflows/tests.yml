# .github/workflows/tests.yml
name: Essential Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  essential-tests:
    name: Settings and I/O regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux desktop metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Validate Linux desktop metadata
        run: |
          rendered_desktop_dir="$(mktemp -d)"
          trap 'rm -rf "$rendered_desktop_dir"' EXIT
          rendered_desktop="$rendered_desktop_dir/io.github.kernalpanic.caveviewer.desktop"
          sed 's|@EXEC@|AppRun|' \
            packaging/linux/io.github.kernalpanic.caveviewer.desktop.in \
            > "$rendered_desktop"
          desktop-file-validate "$rendered_desktop"
          appstreamcli validate --no-net --pedantic \
            packaging/linux/io.github.kernalpanic.caveviewer.metainfo.xml

      - name: Run essential tests with branch coverage
        run: >-
          python -m pytest
          --cov=caveviewer.app
          --cov=caveviewer.core.chunker
          --cov=caveviewer.gui.advanced_settings
          --cov=caveviewer.gui.sample_maps
          --cov=caveviewer.gui.update_checker
          --cov=caveviewer.gui.update_manager
          --cov-branch
          --cov-fail-under=60
          --cov-report=term-missing
          --cov-report=xml

      - name: Enforce sample-map coverage floor
        run: >-
          python -m coverage report
          --include=src/caveviewer/gui/sample_maps.py
          --fail-under=85

      - name: Enforce application coverage floor
        run: >-
          python -m coverage report
          --include=src/caveviewer/app.py
          --fail-under=90

      - name: Enforce chunker coverage floor
        run: >-
          python -m coverage report
          --include=src/caveviewer/core/chunker.py
          --fail-under=90

      - name: Enforce update-checker coverage floor
        run: >-
          python -m coverage report
          --include=src/caveviewer/gui/update_checker.py
          --fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-test-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

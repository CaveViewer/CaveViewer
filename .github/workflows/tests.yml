# .github/workflows/tests.yml
name: Essential Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  essential-tests:
    name: Settings and I/O regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt

      - name: Run essential tests with branch coverage
        run: >-
          python -m pytest
          --cov=caveviewer
          --cov=core.chunker
          --cov=gui.advanced_settings
          --cov=gui.sample_maps
          --cov=gui.update_checker
          --cov-branch
          --cov-fail-under=45
          --cov-report=term-missing
          --cov-report=xml

      - name: Enforce sample-map coverage floor
        run: >-
          python -m coverage report
          --include=gui/sample_maps.py
          --fail-under=50

      - name: Enforce update-checker coverage floor
        run: >-
          python -m coverage report
          --include=gui/update_checker.py
          --fail-under=50

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-test-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

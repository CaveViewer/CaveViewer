name: Website checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caveviewer-website-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Static website contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run static website contracts
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pytest==8.4.2"
          python -m pytest -o addopts='' website/tests/unit/test_site.py -q
          python website/scripts/sync_release.py --check
          git diff --check

  browser-checks:
    name: Browser website checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run browser checks against the staged Pages artifact
        working-directory: website/tests/browser
        run: |
          set -e
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
          python3 "$GITHUB_WORKSPACE/website/scripts/build_site.py" --output "$RUNNER_TEMP/caveviewer-website"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/caveviewer-website" > "$RUNNER_TEMP/caveviewer-site-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html >/dev/null; then
              npm test
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/caveviewer-site-server.log"
          exit 1

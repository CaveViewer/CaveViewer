# .github/workflows/linux-x86_64-release.yml
name: Linux x86_64 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dotted numeric version, e.g. 1.0.64; no v or -rc1 suffix"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Linux x86_64 release"
      preview:
        description: "Publish as a GitHub prerelease and update preview.json"
        required: false
        type: boolean
        default: true
      publish:
        description: "Publish the AppImage to the GitHub release"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: "Dotted numeric version, e.g. 1.0.64; no v or -rc1 suffix"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: "Linux x86_64 release"
      preview:
        description: "Publish as a GitHub prerelease and update preview.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the AppImage to the GitHub release"
        required: false
        type: boolean
        default: false
      skip_essential_tests:
        description: "Skip this workflow's test gate when the caller already ran it"
        required: false
        type: boolean
        default: false
      source_sha:
        description: "Immutable source revision supplied by an orchestrating workflow"
        required: false
        type: string
        default: ""
# Nested reusable workflows cannot elevate permissions granted by their caller.
# Keep write available for publish-linux-x86_64; executable jobs downgrade to read.
permissions:
  contents: read

concurrency:
  group: caveviewer-build-linux-x86_64-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require release/next for publication
        if: ${{ inputs.publish }}
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: test "$RELEASE_BRANCH" = "release/next"

  essential-tests:
    needs: validate-release-branch
    if: ${{ inputs.skip_essential_tests != true }}
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build-linux-x86_64:
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.skip_essential_tests == true || needs.essential-tests.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify Docker build environment
        run: |
          docker version
          docker buildx version

      - name: Install Linux desktop metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Build and package Linux x86_64 AppImage via Docker
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_PREVIEW: ${{ inputs.preview }}
        run: |
          # A single-target Linux package consumes the app bundle produced by
          # the separate build action, so a fresh runner must run both phases.
          release_args=(
            --target=linux-x86_64 \
            --version="$RELEASE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=build \
            --skip-tests
          )
          if [ "$RELEASE_PREVIEW" = "true" ]; then
            release_args+=(--preview)
          fi
          ./scripts/release.sh "${release_args[@]}"

          release_args=(
            --target=linux-x86_64 \
            --version="$RELEASE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=package \
            --skip-tests
          )
          if [ "$RELEASE_PREVIEW" = "true" ]; then
            release_args+=(--preview)
          fi
          ./scripts/release.sh "${release_args[@]}"

      - name: Smoke-test AppImage desktop integration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.preview && 'preview' || 'stable' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app_id="io.github.caveviewer.caveviewer"
          appimage="$(pwd)/dist/linux/x86_64/packages/CaveViewer-${RELEASE_VERSION}-x86_64.AppImage"
          metadata="$(pwd)/dist/linux/x86_64/metadata/CaveViewer-${RELEASE_VERSION}-linux-x86_64.json"
          test -x "$appimage"
          python3 scripts/common/verify_release_channel.py \
            --metadata-file "$metadata" \
            --expected-release-channel "$RELEASE_CHANNEL"

          smoke_root="$(mktemp -d)"
          extracted_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root" "$extracted_root"' EXIT
          (
            cd "$extracted_root"
            "$appimage" --appimage-extract >/dev/null
          )
          bundled_release_metadata="$(find "$extracted_root/squashfs-root" -type f -path '*caveviewer/resources/release_metadata.v1.json' -print -quit)"
          test -n "$bundled_release_metadata"
          python3 - "$bundled_release_metadata" "$RELEASE_CHANNEL" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {"schema_version": 1, "release_channel": sys.argv[2]}
          if payload != expected:
              raise SystemExit(f"Unexpected embedded release metadata: {payload!r}")
          PY
          export HOME="$smoke_root/home"
          export XDG_DATA_HOME="$smoke_root/xdg-data"
          export XDG_RUNTIME_DIR="$smoke_root/runtime"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          CAVEVIEWER_APPRUN_INSTALL_ONLY=1 "$appimage"

          installed_desktop="$XDG_DATA_HOME/applications/${app_id}.desktop"
          installed_metainfo="$XDG_DATA_HOME/metainfo/${app_id}.metainfo.xml"
          test -f "$installed_desktop"
          test -f "$installed_metainfo"
          test -n "$(find "$XDG_DATA_HOME/icons/hicolor" -path "*/apps/${app_id}.png" -type f -print -quit)"
          grep -F "Exec=\"$appimage\" %f" "$installed_desktop"
          if [ -f "$XDG_DATA_HOME/applications/mimeapps.list" ] && \
              grep -F "${app_id}.desktop" "$XDG_DATA_HOME/applications/mimeapps.list"; then
            echo "AppRun must not assign CaveViewer as a MIME default."
            exit 1
          fi

          desktop-file-validate "$installed_desktop"
          appstreamcli validate --no-net --pedantic "$installed_metainfo"

          CAVEVIEWER_APPRUN_UNINSTALL=1 "$appimage"
          test ! -e "$installed_desktop"
          test ! -e "$installed_metainfo"
          if find "$XDG_DATA_HOME/icons/hicolor" -path "*/apps/${app_id}.png" -type f -print -quit | grep -q .; then
            echo "AppRun uninstall left CaveViewer hicolor icons behind."
            exit 1
          fi

      - name: Upload Linux x86_64 AppImage for testing
        uses: actions/upload-artifact@v7
        with:
          name: CaveViewer-${{ inputs.version }}-linux-x86_64
          path: |
            dist/linux/x86_64/packages/CaveViewer-${{ inputs.version }}-x86_64.AppImage
            dist/linux/x86_64/metadata/CaveViewer-${{ inputs.version }}-linux-x86_64.json
          if-no-files-found: error

  publish-linux-x86_64:
    needs: build-linux-x86_64
    if: ${{ inputs.publish && needs.build-linux-x86_64.result == 'success' }}
    uses: ./.github/workflows/finalize-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      preview: ${{ inputs.preview }}
      platforms: linux-x86_64
      source_sha: ${{ inputs.source_sha || github.sha }}
      target_branch: ${{ github.ref_name }}

# .github/workflows/linux-x86_64-release.yml
name: Linux x86_64 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.34"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Linux x86_64 release"
      pre_release:
        description: "Publish as a GitHub prerelease and update prerelease.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the AppImage to the GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: caveviewer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  essential-tests:
    uses: ./.github/workflows/tests.yml

  build-linux-x86_64:
    needs: essential-tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify Docker build environment
        run: |
          docker version
          docker buildx version

      - name: Configure release signing key
        if: ${{ inputs.publish }}
        env:
          SIGNING_PRIVATE_KEY_PEM: ${{ secrets.CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_PRIVATE_KEY_PEM" ]; then
            echo "Error: CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY secret is required when publish is true."
            exit 1
          fi
          printf '%s' "$SIGNING_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/release_signing_private_key.pem"
          chmod 600 "$RUNNER_TEMP/release_signing_private_key.pem"

      - name: Build Linux x86_64 AppImage via Docker
        env:
          GH_TOKEN: ${{ github.token }}
          CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/release_signing_private_key.pem
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          release_args=(
            --target=linux-x86_64
            --version="$RELEASE_VERSION"
            --notes="$RELEASE_NOTES"
          )

          if [ "$PUBLISH_RELEASE" = "true" ]; then
            release_args+=(--action=release)
            if [ "$PRE_RELEASE" = "true" ]; then
              release_args+=(--pre-release)
            fi
          else
            release_args+=(--action=package)
          fi

          ./scripts/release.sh "${release_args[@]}"

      - name: Upload Linux x86_64 AppImage for testing
        uses: actions/upload-artifact@v4
        with:
          name: CaveViewer-${{ inputs.version }}-linux-x86_64
          path: dist/linux/x86_64/packages/CaveViewer-${{ inputs.version }}-x86_64.AppImage
          if-no-files-found: error

# .github/workflows/linux-x86_64-release.yml
name: Linux x86_64 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.34"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Linux x86_64 release"
      publish:
        description: "Publish the AppImage to the GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify Docker build environment
        run: |
          docker version
          docker buildx version

      - name: Build Linux x86_64 AppImage via Docker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            ./scripts/release.sh all-package \
              --version="${{ inputs.version }}" \
              --linux-arch=amd64 \
              --linux-build=docker \
              --skip=macos,windows \
              --publish \
              --release-notes="${{ inputs.release_notes }}"
          else
            ./scripts/release.sh all-package \
              --version="${{ inputs.version }}" \
              --linux-arch=amd64 \
              --linux-build=docker \
              --skip=macos,windows \
              --release-notes="${{ inputs.release_notes }}"
          fi

      - name: Upload Linux x86_64 AppImage for testing
        uses: actions/upload-artifact@v4
        with:
          name: CaveViewer-${{ inputs.version }}-linux-x86_64
          path: dist/linux/packages/CaveViewer-${{ inputs.version }}-x86_64.AppImage
          if-no-files-found: error

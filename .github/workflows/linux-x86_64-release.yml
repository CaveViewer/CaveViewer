# .github/workflows/linux-x86_64-release.yml
name: Linux x86_64 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.34"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Linux x86_64 release"
      pre_release:
        description: "Publish as a GitHub prerelease and update prerelease.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the AppImage to the GitHub release"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Release version, e.g. 1.0.34"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: "Linux x86_64 release"
      pre_release:
        description: "Publish as a GitHub prerelease and update prerelease.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the AppImage to the GitHub release"
        required: false
        type: boolean
        default: false
      skip_essential_tests:
        description: "Skip this workflow's test gate when the caller already ran it"
        required: false
        type: boolean
        default: false
      source_sha:
        description: "Immutable source revision supplied by an orchestrating workflow"
        required: false
        type: string
        default: ""
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY:
        description: "Private key used to sign published update manifests"
        required: false

# Nested reusable workflows cannot elevate permissions granted by their caller.
# Keep write available for publish-linux-x86_64; executable jobs downgrade to read.
permissions:
  contents: write

concurrency:
  group: caveviewer-build-linux-x86_64-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  essential-tests:
    if: ${{ inputs.skip_essential_tests != true }}
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build-linux-x86_64:
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.skip_essential_tests == true || needs.essential-tests.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify Docker build environment
        run: |
          docker version
          docker buildx version

      - name: Build and package Linux x86_64 AppImage via Docker
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          # A single-target Linux package consumes the app bundle produced by
          # the separate build action, so a fresh runner must run both phases.
          ./scripts/release.sh \
            --target=linux-x86_64 \
            --version="$RELEASE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=build \
            --skip-tests

          ./scripts/release.sh \
            --target=linux-x86_64 \
            --version="$RELEASE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=package \
            --skip-tests

      - name: Upload Linux x86_64 AppImage for testing
        uses: actions/upload-artifact@v4
        with:
          name: CaveViewer-${{ inputs.version }}-linux-x86_64
          path: dist/linux/x86_64/packages/CaveViewer-${{ inputs.version }}-x86_64.AppImage
          if-no-files-found: error

  publish-linux-x86_64:
    needs: build-linux-x86_64
    if: ${{ inputs.publish && needs.build-linux-x86_64.result == 'success' }}
    uses: ./.github/workflows/finalize-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      platforms: linux-x86_64
      source_sha: ${{ inputs.source_sha || github.sha }}
      target_branch: ${{ github.ref_name }}
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY }}

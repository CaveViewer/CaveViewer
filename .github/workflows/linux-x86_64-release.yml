# .github/workflows/linux-x86_64-release.yml
name: Linux x86_64 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.34"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Linux x86_64 release"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file fuse libfuse2

      - name: Build and publish Linux x86_64 AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release.sh all-package \
            --version="${{ inputs.version }}" \
            --linux-arch=amd64 \
            --skip=macos,windows \
            --publish \
            --release-notes="${{ inputs.release_notes }}"
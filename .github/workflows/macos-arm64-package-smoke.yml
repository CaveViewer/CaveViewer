name: macOS ARM64 Package Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "42 10 * * 2"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/macos-arm64-package-smoke.yml"
      - ".github/workflows/macos-arm64-release.yml"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "requirements*.txt"
      - "pyproject.toml"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/macos-arm64-package-smoke.yml"
      - ".github/workflows/macos-arm64-release.yml"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: caveviewer-macos-arm64-package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-package-smoke:
    name: macOS ARM64 package smoke
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve package smoke version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path

          version_file = Path("src/caveviewer/version.py")
          text = version_file.read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              raise SystemExit(f"APP_VERSION not found in {version_file}")
          print(f"SMOKE_VERSION={match.group(1)}")
          PY

      - name: Build macOS ARM64 DMG
        env:
          RELEASE_NOTES: macOS ARM64 package smoke
        run: |
          ./scripts/release.sh \
            --target=macos-arm64 \
            --version="$SMOKE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=package \
            --skip-tests

      - name: Smoke-test macOS ARM64 DMG
        run: |
          dmg="$(pwd)/dist/macos/packages/CaveViewer-${SMOKE_VERSION}-macos-arm64.dmg"
          metadata="$(pwd)/dist/macos/metadata/CaveViewer-${SMOKE_VERSION}-macos-arm64.json"
          test -f "$dmg"
          test -f "$metadata"

          python - "$dmg" "$metadata" "$SMOKE_VERSION" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          dmg = pathlib.Path(sys.argv[1])
          metadata = pathlib.Path(sys.argv[2])
          version = sys.argv[3]
          payload = json.loads(metadata.read_text(encoding="utf-8"))
          hasher = hashlib.sha256()
          with dmg.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  hasher.update(chunk)
          digest = hasher.hexdigest()

          expected_artifact_name = f"CaveViewer-{version}-macos-arm64.dmg"
          expected_artifact_path = f"dist/macos/packages/{expected_artifact_name}"
          checks = {
              "app_name": "CaveViewer",
              "version": version,
              "platform": "macos",
              "architecture": "arm64",
              "artifact_file": expected_artifact_name,
              "artifact_path": expected_artifact_path,
              "sha256": digest,
              "size_bytes": dmg.stat().st_size,
          }
          for key, expected in checks.items():
              actual = payload.get(key)
              if actual != expected:
                  raise SystemExit(f"{metadata}: {key} is {actual!r}, expected {expected!r}")
          PY

          mount_dir="$(mktemp -d)"
          attached=0
          cleanup() {
            if [ "$attached" = "1" ]; then
              hdiutil detach "$mount_dir" -quiet || hdiutil detach "$mount_dir" -force -quiet || true
            fi
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          attached=1

          app="$mount_dir/CaveViewer.app"
          info="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/CaveViewer"
          test -d "$app"
          test -f "$info"
          test -x "$executable"
          test -f "$mount_dir/README.md"
          test -f "$mount_dir/LICENSE"
          test -f "$mount_dir/THIRD_PARTY_NOTICES.md"
          test -L "$mount_dir/Applications"

          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$info" | grep -Fx "CaveViewer"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$info" | grep -Fx "CaveViewer"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$info" | grep -Fx "$SMOKE_VERSION"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$info" | grep -Fx "$SMOKE_VERSION"
          lipo -archs "$executable" | grep -qw "arm64"

      - name: Upload macOS ARM64 package smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CaveViewer-${{ env.SMOKE_VERSION }}-macos-arm64-package-smoke
          path: |
            dist/macos/packages/CaveViewer-${{ env.SMOKE_VERSION }}-macos-arm64.dmg
            dist/macos/metadata/CaveViewer-${{ env.SMOKE_VERSION }}-macos-arm64.json
          if-no-files-found: error
          retention-days: 7

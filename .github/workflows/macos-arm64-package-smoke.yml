name: macOS ARM64 Package Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "42 10 * * 2"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/macos-arm64-package-smoke.yml"
      - ".github/workflows/macos-arm64-release.yml"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "requirements*.txt"
      - "pyproject.toml"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/macos-arm64-package-smoke.yml"
      - ".github/workflows/macos-arm64-release.yml"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: caveviewer-macos-arm64-package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-package-smoke:
    name: macOS ARM64 package smoke
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Resolve package smoke version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path

          version_file = Path("src/caveviewer/version.py")
          text = version_file.read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              raise SystemExit(f"APP_VERSION not found in {version_file}")
          print(f"SMOKE_VERSION={match.group(1)}")
          PY

      - name: Build macOS ARM64 DMG
        env:
          RELEASE_NOTES: macOS ARM64 package smoke
        run: |
          ./scripts/release.sh \
            --target=macos-arm64 \
            --version="$SMOKE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=package \
            --skip-tests

      - name: Smoke-test macOS ARM64 DMG
        run: ./scripts/macos/smoke_dmg.sh --arch=arm64 --version="$SMOKE_VERSION"

      - name: Upload macOS ARM64 package smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CaveViewer-${{ env.SMOKE_VERSION }}-macos-arm64-package-smoke
          path: |
            dist/macos/packages/CaveViewer-${{ env.SMOKE_VERSION }}-macos-arm64.dmg
            dist/macos/metadata/CaveViewer-${{ env.SMOKE_VERSION }}-macos-arm64.json
          if-no-files-found: error
          retention-days: 7

# .github/workflows/all-platform-release.yml
name: All Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dotted numeric version, e.g. 1.0.64; no v or -rc1 suffix"
        required: true
        type: string
      release_notes:
        description: "Release notes used for every platform"
        required: false
        type: string
        default: "CaveViewer release"
      pre_release:
        description: "Publish as a GitHub prerelease and update prerelease.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish every platform artifact to the GitHub release"
        required: false
        type: boolean
        default: false
      allow_unsigned_windows_community:
        description: "Publish the unsigned Windows community installer; Windows warnings are expected"
        required: false
        type: boolean
        default: false
      reuse_pr_validation:
        description: "Reuse successful PR validation when app/package source has not changed; skip duplicate test suites"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: caveviewer-all-platform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  essential-tests:
    if: ${{ inputs.reuse_pr_validation != true }}
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  validate-windows-publish-policy:
    if: ${{ inputs.publish && inputs.allow_unsigned_windows_community != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject unavailable signed Windows release path
        run: |
          echo "Error: published Windows installers currently require the unsigned community policy."
          echo "Select 'Publish the unsigned Windows community installer; Windows warnings are expected'."
          exit 1

  windows:
    name: Windows
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.reuse_pr_validation == true || needs.essential-tests.result == 'success') }}
    uses: ./.github/workflows/windows-release.yml
    # Preserve write through the reusable-workflow call chain. The called
    # workflow downgrades its test and package jobs to read-only.
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      # Finalize Release is the single publisher. Its Windows artifact must be
      # explicitly marked as the unsigned community installer when publishing.
      allow_unsigned_windows_community: ${{ inputs.publish && inputs.allow_unsigned_windows_community }}
      skip_essential_tests: true
      reuse_pr_validation: ${{ inputs.reuse_pr_validation }}
      source_sha: ${{ github.sha }}

  linux-x86_64:
    name: Linux x86_64
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.reuse_pr_validation == true || needs.essential-tests.result == 'success') }}
    uses: ./.github/workflows/linux-x86_64-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      skip_essential_tests: true
      reuse_pr_validation: ${{ inputs.reuse_pr_validation }}
      source_sha: ${{ github.sha }}

  macos-arm64:
    name: macOS ARM64
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.reuse_pr_validation == true || needs.essential-tests.result == 'success') }}
    uses: ./.github/workflows/macos-arm64-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      skip_essential_tests: true
      reuse_pr_validation: ${{ inputs.reuse_pr_validation }}
      source_sha: ${{ github.sha }}

  macos-x86_64:
    name: macOS x86_64
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.reuse_pr_validation == true || needs.essential-tests.result == 'success') }}
    uses: ./.github/workflows/macos-x86_64-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      skip_essential_tests: true
      reuse_pr_validation: ${{ inputs.reuse_pr_validation }}
      source_sha: ${{ github.sha }}

  finalize-release:
    name: Finalize Release
    needs:
      - validate-windows-publish-policy
      - windows
      - linux-x86_64
      - macos-arm64
      - macos-x86_64
    if: >-
      ${{ inputs.publish && !cancelled()
          && needs.validate-windows-publish-policy.result != 'failure'
          && needs.windows.result == 'success'
          && needs['linux-x86_64'].result == 'success'
          && needs['macos-arm64'].result == 'success'
          && needs['macos-x86_64'].result == 'success' }}
    uses: ./.github/workflows/finalize-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      platforms: all
      source_sha: ${{ github.sha }}
      target_branch: ${{ github.ref_name }}
      allow_unsigned_windows_community: ${{ inputs.allow_unsigned_windows_community }}
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY }}

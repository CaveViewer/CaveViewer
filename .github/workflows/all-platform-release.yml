# .github/workflows/all-platform-release.yml
name: All Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dotted numeric version, e.g. 1.0.64; no v or -rc1 suffix"
        required: true
        type: string
      release_notes:
        description: "Release notes used for every platform"
        required: false
        type: string
        default: "CaveViewer release"
      preview:
        description: "Publish as a GitHub prerelease and update preview.json"
        required: false
        type: boolean
        default: true
      publish:
        description: "Publish every platform artifact; the Windows installer is unsigned and Windows warnings are expected"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: caveviewer-all-platform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require release/next for publication
        if: ${{ inputs.publish }}
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: test "$RELEASE_BRANCH" = "release/next"

  essential-tests:
    needs: validate-release-branch
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  windows:
    name: Windows
    needs: essential-tests
    if: ${{ !cancelled() && needs.essential-tests.result == 'success' }}
    uses: ./.github/workflows/windows-release.yml
    # Preserve write through the reusable-workflow call chain. The called
    # workflow downgrades its test and package jobs to read-only.
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      preview: ${{ inputs.preview }}
      publish: false
      # Finalize Release is the single publisher. Mark the package as unsigned
      # community only when the complete release will be published.
      allow_unsigned_windows_community: ${{ inputs.publish }}
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  linux-x86_64:
    name: Linux x86_64
    needs: essential-tests
    if: ${{ !cancelled() && needs.essential-tests.result == 'success' }}
    uses: ./.github/workflows/linux-x86_64-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      preview: ${{ inputs.preview }}
      publish: false
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  macos-arm64:
    name: macOS ARM64
    needs: essential-tests
    if: ${{ !cancelled() && needs.essential-tests.result == 'success' }}
    uses: ./.github/workflows/macos-arm64-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      preview: ${{ inputs.preview }}
      publish: false
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  macos-x86_64:
    name: macOS x86_64
    needs: essential-tests
    if: ${{ !cancelled() && needs.essential-tests.result == 'success' }}
    uses: ./.github/workflows/macos-x86_64-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      preview: ${{ inputs.preview }}
      publish: false
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  finalize-release:
    name: Finalize Release
    needs:
      - windows
      - linux-x86_64
      - macos-arm64
      - macos-x86_64
    if: >-
      ${{ inputs.publish && !cancelled()
          && needs.windows.result == 'success'
          && needs['linux-x86_64'].result == 'success'
          && needs['macos-arm64'].result == 'success'
          && needs['macos-x86_64'].result == 'success' }}
    uses: ./.github/workflows/finalize-release.yml
    # Required for production-release environment secrets to cross the
    # reusable-workflow boundary. No package or test call inherits secrets.
    secrets: inherit
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      preview: ${{ inputs.preview }}
      platforms: all
      source_sha: ${{ github.sha }}
      target_branch: ${{ github.ref_name }}
      allow_unsigned_windows_community: ${{ inputs.publish }}

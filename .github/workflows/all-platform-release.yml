# .github/workflows/all-platform-release.yml
name: All Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.63"
        required: true
        type: string
      release_notes:
        description: "Release notes used for every platform"
        required: false
        type: string
        default: "CaveViewer release"
      pre_release:
        description: "Publish as a GitHub prerelease and update prerelease.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish every platform artifact to the GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: caveviewer-all-platform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  essential-tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  windows:
    name: Windows
    needs: essential-tests
    uses: ./.github/workflows/windows-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  linux-arm64:
    name: Linux ARM64
    needs: essential-tests
    uses: ./.github/workflows/linux-arm64-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  linux-x86_64:
    name: Linux x86_64
    needs: essential-tests
    uses: ./.github/workflows/linux-x86_64-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  macos-arm64:
    name: macOS ARM64
    needs: essential-tests
    uses: ./.github/workflows/macos-arm64-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  macos-x86_64:
    name: macOS x86_64
    needs: essential-tests
    uses: ./.github/workflows/macos-x86_64-release.yml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      publish: false
      skip_essential_tests: true
      source_sha: ${{ github.sha }}

  finalize-release:
    name: Finalize Release
    needs:
      - windows
      - linux-arm64
      - linux-x86_64
      - macos-arm64
      - macos-x86_64
    if: >-
      ${{ inputs.publish && !cancelled()
          && needs.windows.result == 'success'
          && needs['linux-arm64'].result == 'success'
          && needs['linux-x86_64'].result == 'success'
          && needs['macos-arm64'].result == 'success'
          && needs['macos-x86_64'].result == 'success' }}
    uses: ./.github/workflows/finalize-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      pre_release: ${{ inputs.pre_release }}
      platforms: all
      source_sha: ${{ github.sha }}
      target_branch: ${{ github.ref_name }}
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY }}

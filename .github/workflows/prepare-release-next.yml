name: Prepare Release Next

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caveviewer-prepare-release-next
  cancel-in-progress: false

jobs:
  prepare:
    name: Fast-forward release/next to main
    runs-on: ubuntu-latest
    environment: production-release

    steps:
      - name: Require main workflow source
        env:
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: test "$SELECTED_BRANCH" = "main"

      - name: Create release publisher token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CAVEVIEWER_RELEASE_APP_ID }}
          private-key: ${{ secrets.CAVEVIEWER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-app-token.outputs.token }}
          persist-credentials: false

      - name: Fast-forward release/next
        shell: bash
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -euo pipefail
          git_auth="$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/release/next:refs/remotes/origin/release/next
          if ! git merge-base --is-ancestor origin/release/next origin/main; then
            echo "Error: release/next contains changes not reconciled with main." >&2
            echo "Merge the release metadata into main before preparing another release." >&2
            exit 1
          fi
          git push origin \
            refs/remotes/origin/main:refs/heads/release/next

      - name: Summarize prepared source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## release/next prepared"
            echo
            echo "release/next was fast-forwarded to protected main at \`$SOURCE_SHA\`."
            echo "Run an individual-platform or All Platforms release from release/next."
          } >> "$GITHUB_STEP_SUMMARY"

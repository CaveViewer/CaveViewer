name: macOS x86_64 Package Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 2"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/macos-x86_64-package-smoke.yml"
      - ".github/workflows/macos-x86_64-release.yml"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/macos-x86_64-package-smoke.yml"
      - ".github/workflows/macos-x86_64-release.yml"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: caveviewer-macos-x86_64-package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-x86_64-package-smoke:
    name: macOS x86_64 package smoke
    runs-on: macos-15-intel
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify Intel runtime architecture
        run: |
          test "$(uname -m)" = "x86_64"
          python -c 'import platform; assert platform.machine() == "x86_64", platform.machine()'

      - name: Install Intel test dependencies
        run: |
          python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Run complete Intel test suite
        run: python -m pytest -p no:cacheprovider -q

      - name: Run Intel CLI smoke checks
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          for command in (
              [sys.executable, "-m", "caveviewer", "--update-branch"],
              ["caveviewer", "--update-branch"],
          ):
              result = subprocess.run(command, capture_output=True, text=True)
              if result.returncode != 2 or "Error:" not in result.stderr:
                  raise SystemExit(
                      f"Intel CLI smoke failed for {command!r}: "
                      f"exit={result.returncode}\n{result.stdout}\n{result.stderr}"
                  )
          PY

      - name: Resolve package smoke version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path

          version_file = Path("src/caveviewer/version.py")
          text = version_file.read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              raise SystemExit(f"APP_VERSION not found in {version_file}")
          print(f"SMOKE_VERSION={match.group(1)}")
          PY

      - name: Build macOS x86_64 DMG
        env:
          RELEASE_NOTES: macOS x86_64 package smoke
        run: |
          ./scripts/release.sh \
            --target=macos-x86_64 \
            --version="$SMOKE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=package \
            --skip-tests

      - name: Smoke-test macOS x86_64 DMG
        run: ./scripts/macos/smoke_dmg.sh --arch=x86_64 --version="$SMOKE_VERSION"

      - name: Upload macOS x86_64 package smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CaveViewer-${{ env.SMOKE_VERSION }}-macos-x86_64-package-smoke
          path: |
            dist/macos/packages/CaveViewer-${{ env.SMOKE_VERSION }}-macos-x86_64.dmg
            dist/macos/metadata/CaveViewer-${{ env.SMOKE_VERSION }}-macos-x86_64.json
          if-no-files-found: error
          retention-days: 7

name: Release Promotion

on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: "Exact origin/main revision to release; blank uses the selected main workflow revision"
        required: false
        type: string
      channel:
        description: "Release channel"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - stable
      bump:
        description: "Version increment"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact expected version; blank selects it from the increment"
        required: false
        type: string
      release_notes:
        description: "Release notes used for every platform"
        required: false
        default: "CaveViewer release"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: caveviewer-release-promotion
  cancel-in-progress: false

jobs:
  promote-and-release:
    name: Prepare and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production-release

    steps:
      - name: Resolve main source revision
        id: source
        shell: bash
        env:
          REQUESTED_MAIN_SHA: ${{ inputs.main_sha }}
          SELECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha="$REQUESTED_MAIN_SHA"
          if [ -z "$main_sha" ]; then
            main_sha="$SELECTED_WORKFLOW_SHA"
          fi
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: could not resolve a full main commit SHA." >&2
            exit 1
          fi
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Create release publisher token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CAVEVIEWER_RELEASE_APP_ID }}
          private-key: ${{ secrets.CAVEVIEWER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Check out automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify main revision and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUSH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.source.outputs.main_sha }}
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          git_auth="$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"
          ./scripts/common/preview_release_automation.sh \
            --main-sha="$MAIN_SHA" \
            --channel="$CHANNEL" \
            --bump="$BUMP" \
            --version="$VERSION" \
            --release-notes="$RELEASE_NOTES"

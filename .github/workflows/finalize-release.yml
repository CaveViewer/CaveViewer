# .github/workflows/finalize-release.yml
name: Finalize Release

on:
  workflow_call:
    inputs:
      version:
        description: "Dotted numeric release version without v or suffixes"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: true
        type: string
      preview:
        description: "Publish as a GitHub prerelease and update preview.json"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated release targets or all"
        required: true
        type: string
      source_sha:
        description: "Immutable source revision used by every package job"
        required: true
        type: string
      target_branch:
        description: "Branch that receives the single release metadata commit"
        required: true
        type: string
      allow_unsigned_windows_community:
        description: "Accept only explicit unsigned-community Windows package metadata"
        required: false
        type: boolean
        default: false
permissions:
  contents: read

# Builds use target-specific concurrency groups. Only this shared-state writer
# is serialized across release entry points for the selected source branch.
concurrency:
  group: caveviewer-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    # Approval is intentionally requested only after every caller's build and
    # package gates have succeeded and this finalizer is ready to receive the
    # signing key and repository write token.
    environment: production-release

    steps:
      - name: Create release publisher token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CAVEVIEWER_RELEASE_APP_ID }}
          private-key: ${{ secrets.CAVEVIEWER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.release-app-token.outputs.token }}
          persist-credentials: false

      - name: Set up signing Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install manifest signing dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements/release-finalizer-linux.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure release signing key
        # This resolves only after the production-release environment is
        # approved and only through a finalizer call that explicitly inherits
        # secrets across the reusable-workflow boundary.
        env:
          SIGNING_PRIVATE_KEY_PEM: ${{ secrets.CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_PRIVATE_KEY_PEM" ]; then
            echo "Error: CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY secret is required."
            exit 1
          fi
          key_path="$RUNNER_TEMP/release_signing_private_key.pem"
          printf '%s' "$SIGNING_PRIVATE_KEY_PEM" > "$key_path"
          chmod 600 "$key_path"
          echo "CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Verify release signing key pair
        run: >-
          python scripts/verify_release_signing_key.py
          "$CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY"
          src/caveviewer/resources/release_signing_public_key.pem

      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: CaveViewer-${{ inputs.version }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish assets and signed update metadata
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CAVEVIEWER_GITHUB_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TARGET_BRANCH: ${{ inputs.target_branch }}
          PREVIEW: ${{ inputs.preview }}
          ALLOW_UNSIGNED_WINDOWS_COMMUNITY: ${{ inputs.allow_unsigned_windows_community }}
        run: |
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"
          finalize_args=(
            --platforms="$RELEASE_PLATFORMS"
            --version="$RELEASE_VERSION"
            --notes="$RELEASE_NOTES"
            --artifacts-dir="$GITHUB_WORKSPACE/release-artifacts"
            --target-branch="$RELEASE_TARGET_BRANCH"
            --expected-source-sha="$RELEASE_SOURCE_SHA"
          )
          if [ "$PREVIEW" = "true" ]; then
            finalize_args+=(--preview)
          fi
          if [ "$ALLOW_UNSIGNED_WINDOWS_COMMUNITY" = "true" ]; then
            finalize_args+=(--allow-unsigned-windows-community)
          fi
          ./scripts/common/finalize_release.sh "${finalize_args[@]}"

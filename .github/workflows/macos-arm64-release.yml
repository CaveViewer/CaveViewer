# .github/workflows/macos-arm64-release.yml
name: macOS ARM64 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dotted numeric version, e.g. 1.0.64; no v or -rc1 suffix"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "macOS ARM64 release"
      preview:
        description: "Publish as a GitHub prerelease and update preview.json"
        required: false
        type: boolean
        default: true
      publish:
        description: "Publish the macOS ARM64 DMG to the GitHub release"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: "Dotted numeric version, e.g. 1.0.64; no v or -rc1 suffix"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: "macOS ARM64 release"
      preview:
        description: "Publish as a GitHub prerelease and update preview.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the macOS ARM64 DMG to the GitHub release"
        required: false
        type: boolean
        default: false
      skip_essential_tests:
        description: "Skip this workflow's test gate when the caller already ran it"
        required: false
        type: boolean
        default: false
      source_sha:
        description: "Immutable source revision supplied by an orchestrating workflow"
        required: false
        type: string
        default: ""
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY:
        description: "Private key used to sign published update manifests"
        required: false

# Nested reusable workflows cannot elevate permissions granted by their caller.
# Keep write available for publish-macos-arm64; executable jobs downgrade to read.
permissions:
  contents: read

concurrency:
  group: caveviewer-build-macos-arm64-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require release/next for publication
        if: ${{ inputs.publish }}
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: test "$RELEASE_BRANCH" = "release/next"

  essential-tests:
    needs: validate-release-branch
    if: ${{ inputs.skip_essential_tests != true }}
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build-macos-arm64:
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.skip_essential_tests == true || needs.essential-tests.result == 'success') }}
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Build macOS ARM64 DMG
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_PREVIEW: ${{ inputs.preview }}
        run: |
          release_args=(
            --target=macos-arm64 \
            --version="$RELEASE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=package \
            --skip-tests
          )
          if [ "$RELEASE_PREVIEW" = "true" ]; then
            release_args+=(--preview)
          fi
          ./scripts/release.sh "${release_args[@]}"

      - name: Smoke-test macOS ARM64 DMG
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.preview && 'preview' || 'stable' }}
        run: ./scripts/macos/smoke_dmg.sh --arch=arm64 --version="$RELEASE_VERSION" --release-channel="$RELEASE_CHANNEL"

      - name: Upload macOS ARM64 DMG for testing
        uses: actions/upload-artifact@v7
        with:
          name: CaveViewer-${{ inputs.version }}-macos-arm64
          path: |
            dist/macos/packages/CaveViewer-${{ inputs.version }}-macos-arm64.dmg
            dist/macos/metadata/CaveViewer-${{ inputs.version }}-macos-arm64.json
          if-no-files-found: error

  publish-macos-arm64:
    needs: build-macos-arm64
    if: ${{ inputs.publish && needs.build-macos-arm64.result == 'success' }}
    uses: ./.github/workflows/finalize-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      preview: ${{ inputs.preview }}
      platforms: macos-arm64
      source_sha: ${{ inputs.source_sha || github.sha }}
      target_branch: ${{ github.ref_name }}
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY }}

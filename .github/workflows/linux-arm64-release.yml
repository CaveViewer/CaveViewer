# .github/workflows/linux-arm64-release.yml
name: Linux ARM64 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.39"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Linux ARM64 release"

permissions:
  contents: write

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            file \
            fuse \
            libfuse2 \
            libfreetype6-dev \
            libjpeg-dev \
            libopenjp2-7-dev \
            libtiff-dev \
            libwebp-dev \
            python3-tk \
            tcl-dev \
            tk-dev \
            zlib1g-dev
          sudo mkdir -p /tools/llvm/bin
          sudo ln -sf "$(command -v ar)" /tools/llvm/bin/llvm-ar
          sudo ln -sf "$(command -v ranlib)" /tools/llvm/bin/llvm-ranlib
          sudo ln -sf "$(command -v nm)" /tools/llvm/bin/llvm-nm
          ls -l /tools/llvm/bin/llvm-ar /tools/llvm/bin/llvm-ranlib /tools/llvm/bin/llvm-nm

      - name: Build and publish Linux ARM64 AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release.sh all-package \
            --version="${{ inputs.version }}" \
            --linux-arch=arm64 \
            --skip=macos,windows \
            --publish \
            --release-notes="${{ inputs.release_notes }}"

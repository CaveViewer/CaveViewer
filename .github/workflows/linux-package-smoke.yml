name: Linux Package Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "27 9 * * 1"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/linux-package-smoke.yml"
      - ".github/workflows/linux-x86_64-release.yml"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "requirements*.txt"
      - "pyproject.toml"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/linux-package-smoke.yml"
      - ".github/workflows/linux-x86_64-release.yml"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: caveviewer-linux-package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package-smoke:
    name: Linux x86_64 package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Docker build environment
        run: |
          docker version
          docker buildx version

      - name: Install Linux desktop metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Resolve package smoke version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path

          version_file = Path("src/caveviewer/version.py")
          text = version_file.read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', text, re.MULTILINE)
          if not match:
              raise SystemExit(f"APP_VERSION not found in {version_file}")
          print(f"SMOKE_VERSION={match.group(1)}")
          PY

      - name: Build and package Linux x86_64 AppImage via Docker
        env:
          RELEASE_NOTES: Linux package smoke
        run: |
          ./scripts/release.sh \
            --target=linux-x86_64 \
            --version="$SMOKE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=build \
            --skip-tests

          ./scripts/release.sh \
            --target=linux-x86_64 \
            --version="$SMOKE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=package \
            --skip-tests

      - name: Smoke-test AppImage desktop integration
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app_id="io.github.caveviewer.caveviewer"
          appimage="$(pwd)/dist/linux/x86_64/packages/CaveViewer-${SMOKE_VERSION}-x86_64.AppImage"
          test -x "$appimage"

          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          export HOME="$smoke_root/home"
          export XDG_DATA_HOME="$smoke_root/xdg-data"
          export XDG_RUNTIME_DIR="$smoke_root/runtime"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          CAVEVIEWER_APPRUN_INSTALL_ONLY=1 "$appimage"

          installed_desktop="$XDG_DATA_HOME/applications/${app_id}.desktop"
          installed_metainfo="$XDG_DATA_HOME/metainfo/${app_id}.metainfo.xml"
          test -f "$installed_desktop"
          test -f "$installed_metainfo"
          test -n "$(find "$XDG_DATA_HOME/icons/hicolor" -path "*/apps/${app_id}.png" -type f -print -quit)"
          grep -F "Exec=\"$appimage\" %f" "$installed_desktop"
          if [ -f "$XDG_DATA_HOME/applications/mimeapps.list" ] && \
              grep -F "${app_id}.desktop" "$XDG_DATA_HOME/applications/mimeapps.list"; then
            echo "AppRun must not assign CaveViewer as a MIME default."
            exit 1
          fi

          desktop-file-validate "$installed_desktop"
          appstreamcli validate --no-net --pedantic "$installed_metainfo"

          CAVEVIEWER_APPRUN_UNINSTALL=1 "$appimage"
          test ! -e "$installed_desktop"
          test ! -e "$installed_metainfo"
          if find "$XDG_DATA_HOME/icons/hicolor" -path "*/apps/${app_id}.png" -type f -print -quit | grep -q .; then
            echo "AppRun uninstall left CaveViewer hicolor icons behind."
            exit 1
          fi

      - name: Upload Linux x86_64 AppImage for inspection
        uses: actions/upload-artifact@v4
        with:
          name: CaveViewer-${{ env.SMOKE_VERSION }}-linux-x86_64-package-smoke
          path: dist/linux/x86_64/packages/CaveViewer-${{ env.SMOKE_VERSION }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

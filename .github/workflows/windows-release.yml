# .github/workflows/windows-release.yml
name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dotted numeric version, e.g. 1.0.64; no v or -rc1 suffix"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Windows release"
      preview:
        description: "Publish as a GitHub prerelease and update preview.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the unsigned Windows installer EXE to the GitHub release; Windows warnings are expected"
        required: false
        type: boolean
        default: true
      reconcile_metadata:
        description: "Validate and merge published metadata into main"
        required: false
        type: boolean
        default: true
      reuse_pr_validation:
        description: "Reuse successful PR validation when app/package source has not changed; skip duplicate test suites"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Dotted numeric version, e.g. 1.0.64; no v or -rc1 suffix"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: "Windows release"
      preview:
        description: "Publish as a GitHub prerelease and update preview.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the unsigned Windows installer EXE to the GitHub release; Windows warnings are expected"
        required: false
        type: boolean
        default: false
      reconcile_metadata:
        description: "Validate and merge published metadata into main"
        required: false
        type: boolean
        default: false
      allow_unsigned_windows_community:
        description: "Mark a package as unsigned-community when publication is finalized by the calling workflow"
        required: false
        type: boolean
        default: false
      skip_essential_tests:
        description: "Skip this workflow's test gate when the caller already ran it"
        required: false
        type: boolean
        default: false
      reuse_pr_validation:
        description: "Reuse successful PR validation when app/package source has not changed; skip duplicate test suites"
        required: false
        type: boolean
        default: false
      source_sha:
        description: "Immutable source revision supplied by an orchestrating workflow"
        required: false
        type: string
        default: ""
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY:
        description: "Private key used to sign published update manifests"
        required: false

# Nested reusable workflows cannot elevate permissions granted by their caller.
# Keep write available for publish-windows; executable jobs downgrade to read.
permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: caveviewer-build-windows-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require release/next for publication
        if: ${{ inputs.publish }}
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: test "$RELEASE_BRANCH" = "release/next"

  essential-tests:
    needs: validate-release-branch
    if: ${{ inputs.skip_essential_tests != true && inputs.reuse_pr_validation != true }}
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build-windows:
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.skip_essential_tests == true || inputs.reuse_pr_validation == true || needs.essential-tests.result == 'success') }}
    # Hosted releases currently use the explicit unsigned-community policy.
    # Keep the build on GitHub-hosted Windows until Authenticode support returns.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_PREVIEW: ${{ inputs.preview }}
          CAVEVIEWER_ALLOW_UNSIGNED_WINDOWS_PACKAGE: "1"
          CAVEVIEWER_WINDOWS_UNSIGNED_RELEASE: ${{ (inputs.publish || inputs.allow_unsigned_windows_community) && 'community' || '' }}
          CAVEVIEWER_INNO_SETUP_COMPILER: "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
        run: |
          release_args=(
            --target=windows \
            --version="$RELEASE_VERSION" \
            --notes="$RELEASE_NOTES" \
            --action=package \
            --skip-tests
          )
          if [ "$RELEASE_PREVIEW" = "true" ]; then
            release_args+=(--preview)
          fi
          ./scripts/release.sh "${release_args[@]}"

      - name: Smoke-test Windows installer and update handoff
        shell: powershell
        env:
          SMOKE_VERSION: ${{ inputs.version }}
          SMOKE_RELEASE_CHANNEL: ${{ inputs.preview && 'preview' || 'stable' }}
          SMOKE_UNSIGNED_COMMUNITY: ${{ (inputs.publish || inputs.allow_unsigned_windows_community) && 'true' || 'false' }}
        run: |
          $smokeArguments = @{
            InstallerPath = "dist/windows/packages/CaveViewer-$env:SMOKE_VERSION-windows.exe"
            MetadataPath = "dist/windows/metadata/CaveViewer-$env:SMOKE_VERSION.json"
            UpdateMetadataPath = "dist/windows/metadata/CaveViewer-$env:SMOKE_VERSION.update.json"
            ExpectedVersion = $env:SMOKE_VERSION
            ExpectedReleaseChannel = $env:SMOKE_RELEASE_CHANNEL
          }
          if ($env:SMOKE_UNSIGNED_COMMUNITY -eq "true") {
            $smokeArguments.AllowUnsignedCommunity = $true
          }
          else {
            $smokeArguments.AllowUnsigned = $true
          }
          & .\scripts\windows\smoke_installer.ps1 @smokeArguments

      - name: Upload Windows installer for testing
        uses: actions/upload-artifact@v7
        with:
          name: CaveViewer-${{ inputs.version }}-windows
          path: |
            dist/windows/packages/CaveViewer-${{ inputs.version }}-windows.exe
            dist/windows/metadata/CaveViewer-${{ inputs.version }}.json
            dist/windows/metadata/CaveViewer-${{ inputs.version }}.update.json
          if-no-files-found: error

  publish-windows:
    needs: build-windows
    if: ${{ !cancelled() && inputs.publish && needs.build-windows.result == 'success' }}
    uses: ./.github/workflows/finalize-release.yml
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      version: ${{ inputs.version }}
      release_notes: ${{ inputs.release_notes }}
      preview: ${{ inputs.preview }}
      platforms: windows
      source_sha: ${{ inputs.source_sha || github.sha }}
      target_branch: ${{ github.ref_name }}
      reconcile_metadata: ${{ inputs.reconcile_metadata }}
      allow_unsigned_windows_community: ${{ inputs.publish || inputs.allow_unsigned_windows_community }}
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY }}

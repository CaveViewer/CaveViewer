# .github/workflows/windows-release.yml
name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.34"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Windows release"
      pre_release:
        description: "Publish as a GitHub prerelease and update prerelease.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the Windows ZIP to the GitHub release"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Release version, e.g. 1.0.34"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: "Windows release"
      pre_release:
        description: "Publish as a GitHub prerelease and update prerelease.json"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the Windows ZIP to the GitHub release"
        required: false
        type: boolean
        default: false
      skip_essential_tests:
        description: "Skip this workflow's test gate when the caller already ran it"
        required: false
        type: boolean
        default: false
    secrets:
      CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY:
        description: "Private key used to sign published update manifests"
        required: false

permissions:
  contents: write

concurrency:
  group: caveviewer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  essential-tests:
    if: ${{ inputs.skip_essential_tests != true }}
    uses: ./.github/workflows/tests.yml

  build-windows:
    needs: essential-tests
    if: ${{ !cancelled() && (inputs.skip_essential_tests == true || needs.essential-tests.result == 'success') }}
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure release signing key
        if: ${{ inputs.publish || inputs.version == '__backfill_windows_manifest_signatures__' }}
        shell: bash
        env:
          SIGNING_PRIVATE_KEY_PEM: ${{ secrets.CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_PRIVATE_KEY_PEM" ]; then
            echo "Error: CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY secret is required when publish is true."
            exit 1
          fi
          key_path="$RUNNER_TEMP/release_signing_private_key.pem"
          printf '%s' "$SIGNING_PRIVATE_KEY_PEM" > "$key_path"
          chmod 600 "$key_path" || true
          echo "CAVEVIEWER_RELEASE_SIGNING_PRIVATE_KEY=$key_path" >> "$GITHUB_ENV"

      # One-time maintenance path used to backfill signatures without rebuilding
      # or replacing the already-published Windows 1.0.63 artifact.
      - name: Backfill existing Windows manifest signatures
        if: ${{ inputs.version == '__backfill_windows_manifest_signatures__' }}
        shell: bash
        run: |
          python -m pip install "cryptography>=43.0.0"
          python scripts/sign_update_manifest.py updates/windows/stable.json
          python scripts/sign_update_manifest.py updates/windows/prerelease.json

          python - <<'PY'
          import base64
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization

          public_key = serialization.load_pem_public_key(
              Path("src/caveviewer/resources/release_signing_public_key.pem").read_bytes()
          )
          for channel in ("stable", "prerelease"):
              manifest = Path(f"updates/windows/{channel}.json")
              signature = Path(f"{manifest}.sig")
              public_key.verify(
                  base64.b64decode(signature.read_bytes().strip(), validate=True),
                  manifest.read_bytes(),
              )
          PY

          git add updates/windows/stable.json.sig updates/windows/prerelease.json.sig
          git commit -m "Sign Windows update manifests"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build Windows ZIP
        if: ${{ inputs.version != '__backfill_windows_manifest_signatures__' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          release_args=(
            --target=windows
            --version="$RELEASE_VERSION"
            --notes="$RELEASE_NOTES"
            --skip-tests
          )

          if [ "$PUBLISH_RELEASE" = "true" ]; then
            release_args+=(--action=release)
            if [ "$PRE_RELEASE" = "true" ]; then
              release_args+=(--pre-release)
            fi
          else
            release_args+=(--action=package)
          fi

          ./scripts/release.sh "${release_args[@]}"

      - name: Upload Windows ZIP for testing
        if: ${{ inputs.version != '__backfill_windows_manifest_signatures__' }}
        uses: actions/upload-artifact@v4
        with:
          name: CaveViewer-${{ inputs.version }}-windows
          path: dist/windows/packages/CaveViewer-${{ inputs.version }}-windows.zip
          if-no-files-found: error

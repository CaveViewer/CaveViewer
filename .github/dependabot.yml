version: 2

updates:
  # Keep workflow actions current without changing the Python dependency flow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Zagreb"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"

  # Update only the isolated, hash-locked privileged finalizer dependencies.
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Zagreb"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "release-security"
    commit-message:
      prefix: "build(deps)"

  # Keep the isolated browser-test harness current.
  - package-ecosystem: "npm"
    directory: "/website/tests/browser"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Zagreb"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "website"
    commit-message:
      prefix: "test(deps)"

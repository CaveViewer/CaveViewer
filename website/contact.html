<main id="main-content" tabindex="-1">
    <section class="contact-page" aria-labelledby="contact-page-title">
        <div class="contact-page__grid" aria-hidden="true"></div>
        <div class="shell contact-page__layout">
            <section class="contact-card" aria-labelledby="contact-form-title" data-reveal>
                <h1 id="contact-page-title">Contact Us</h1>
                <h2 id="contact-form-title" class="sr-only">Contact form</h2>

                <form class="contact-form" action="https://formsubmit.co/azdeatherage@gmail.com" method="POST">
                    <input type="hidden" name="_subject" value="CaveViewer contact form">
                    <input type="hidden" name="_template" value="table">
                    <div class="contact-form__honeypot" aria-hidden="true">
                        <label for="cf-honey">Leave this field blank</label>
                        <input type="text" id="cf-honey" name="_honey" tabindex="-1" autocomplete="off">
                    </div>

                    <div class="contact-form__identity">
                        <div class="contact-form__field">
                            <label for="cf-name">Your name</label>
                            <input type="text" id="cf-name" name="name" placeholder="Paul" required>
                        </div>
                        <div class="contact-form__field">
                            <label for="cf-email">Your email</label>
                            <input type="email" id="cf-email" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="contact-form__field">
                        <label for="cf-message">Message</label>
                        <textarea id="cf-message" name="message" placeholder="Tell us what's on your mind — if it's a problem, include which OS and which map." required></textarea>
                    </div>
                    <button class="button button--primary contact-form__submit" type="submit">Send message <span aria-hidden="true">→</span></button>
                </form>
            </section>
        </div>
    </section>
</main>

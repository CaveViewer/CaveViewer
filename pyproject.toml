[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "CaveViewer"
dynamic = ["version"]
description = "A desktop viewer for large cave-survey 3D scans"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
    "moderngl==5.12.0",
    "numpy==2.5.0",
    "Pillow==12.3.0",
    "moderngl-window==3.1.1",
    "freetype-py==2.5.1",
    "pyglm>=2.7.1",
    "truststore>=0.10.0",
    "cryptography>=43.0.0",
    "imageio-ffmpeg>=0.5.1",
    "pygltflib==1.16.5",
    "dbus-fast==5.0.22; sys_platform == 'linux'",
    "glfw==2.10.0; sys_platform == 'linux'",
]

[project.scripts]
caveviewer = "caveviewer.__main__:run"
caveviewer-benchmark = "caveviewer.benchmark:run"
caveviewer-map-benchmark = "caveviewer.benchmarking.map_runner:run"
caveviewer-chunker = "caveviewer.chunker:main"

[tool.setuptools.dynamic]
version = {attr = "caveviewer.version.APP_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"caveviewer.resources" = [
    "images/*.png",
    "images/ui/*.svg",
    "shaders/*.frag",
    "shaders/*.vert",
    "*.pem",
    "*.json",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--timeout=10",
]
markers = [
    "integration: multi-component or filesystem workflow tests",
    "gui: tests requiring a windowing environment",
    "gl: tests requiring an OpenGL context",
    "slow: intentionally longer-running tests",
    "network: tests with explicitly controlled network behavior",
]

[tool.coverage.run]
branch = true
source = ["caveviewer"]
omit = [
    "tests/*",
    ".venv*/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__:",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

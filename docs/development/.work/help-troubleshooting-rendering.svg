<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="1104" viewBox="0 0 1328 1104" role="img" aria-labelledby="title description">
  <title id="title">Proposed CaveViewer Help Troubleshooting tab</title>
  <desc id="description">A dark Help panel with Troubleshooting selected, a Show latest log button, and a copyable last-error excerpt.</desc>
  <rect width="1328" height="1104" fill="#08090c"/>
  <rect x="2" y="2" width="1324" height="1100" fill="none" stroke="#343946" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#eef1ff" font-size="25">
    <text x="60" y="102">▱</text><text x="112" y="102">Map Library</text>
    <text x="60" y="180">⚙</text><text x="112" y="180">Preferences</text>
    <circle cx="77" cy="248" r="16" fill="none" stroke="#ffe36a" stroke-width="2"/>
    <text x="70" y="257" fill="#ffe36a" font-weight="700">?</text>
    <text x="112" y="258" fill="#ffe36a" font-weight="700">Help</text>
    <circle cx="77" cy="326" r="16" fill="none" stroke="#eef1ff" stroke-width="2"/>
    <text x="73" y="335" font-weight="700">i</text><text x="112" y="336">About</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    <text x="480" y="64" fill="#bcc3d5">Keys</text>
    <text x="575" y="64" fill="#bcc3d5">Capture</text>
    <text x="700" y="64" fill="#ffc400">Troubleshooting</text>
    <rect x="700" y="82" width="176" height="3" fill="#ffc400"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="462" y="152" fill="#dce3f4" font-size="19" font-weight="700">APPLICATION LOGS</text>
    <text x="462" y="194" fill="#e9edfa" font-size="22">Share the latest log with support to help diagnose a problem.</text>
    <rect x="462" y="226" rx="4" ry="4" width="210" height="52" fill="#ffc400"/>
    <text x="486" y="260" fill="#111318" font-size="20" font-weight="700">Show latest log</text>
    <text x="690" y="260" fill="#aeb7ca" font-size="17">Opens the log folder and selects the newest file.</text>

    <text x="462" y="358" fill="#dce3f4" font-size="19" font-weight="700">LAST ERROR</text>
    <rect x="1048" y="326" rx="4" ry="4" width="118" height="52" fill="#1a1d25" stroke="#4b5366"/>
    <rect x="1066" y="343" width="14" height="17" fill="none" stroke="#eef1ff" stroke-width="2"/>
    <path d="M1071 339h14v17" fill="none" stroke="#eef1ff" stroke-width="2"/>
    <text x="1096" y="359" fill="#eef1ff" font-size="17" font-weight="700">Copy</text>

    <rect x="462" y="398" rx="4" ry="4" width="704" height="306" fill="#11131a" stroke="#394152"/>
    <g fill="#d8deef" font-family="Consolas, Menlo, monospace" font-size="17">
      <text x="486" y="437">2026-08-29T14:31:07 [caveviewer] INFO:</text>
      <text x="486" y="466">Opening selected map</text>
      <text x="486" y="506">2026-08-29T14:31:08 [caveviewer] INFO:</text>
      <text x="486" y="535">Creating viewer window</text>
      <text x="486" y="575">2026-08-29T14:31:09 [caveviewer] INFO:</text>
      <text x="486" y="604">Loading render context</text>
      <text x="486" y="644" fill="#ffb8b8">2026-08-29T14:31:09 [caveviewer] ERROR:</text>
      <text x="486" y="673" fill="#ffb8b8">Unable to create the OpenGL context</text>
    </g>
    <text x="462" y="744" fill="#aeb7ca" font-size="17">Shows the last error and the three log lines before it.</text>
  </g>

  <rect x="1318" y="124" width="8" height="902" rx="4" fill="#343b4b"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19">
    <text x="60" y="1010" fill="#e9edfa">Version 0.0.0</text>
    <text x="60" y="1059" fill="#ffc400">Update to 1.0.94</text>
  </g>
</svg>
